services:
  # ----------------------------
  # Caddy — Reverse Proxy + Automatic SSL (Let's Encrypt)
  # ----------------------------
  caddy:
    image: caddy:2-alpine
    container_name: LMS_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------
  # Next.js Application
  # ----------------------------
  app:
    image: technurturelabs-app:latest
    container_name: LMS_app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://technurturelms.in}
        - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:admin@db:5432/technurturelabs}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - MEDIA_SECRET=${MEDIA_SECRET:-}
      - CRON_SECRET=${CRON_SECRET:-}
      # Cloudflare R2 — leave empty to use local fallback storage
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_ACCESS_KEY_ID=${CLOUDFLARE_ACCESS_KEY_ID:-}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY:-}
      - CLOUDFLARE_BUCKET_NAME=${CLOUDFLARE_BUCKET_NAME:-}
      - CLOUDFLARE_PUBLIC_DOMAIN=${CLOUDFLARE_PUBLIC_DOMAIN:-}
      - CLOUDFLARE_WORKER_URL=${CLOUDFLARE_WORKER_URL:-}
      # Cloudflare Stream — for video hosting
      - CLOUDFLARE_STREAM_API_TOKEN=${CLOUDFLARE_STREAM_API_TOKEN:-}
      # Razorpay
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://technurturelms.in}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Local fallback storage — used when R2 is not configured or fails
      - storage_data:/app/local_storage



  # ----------------------------
  # Event Processing Worker (Achievements, Streaks, Challenges)
  # ----------------------------
  event-worker:
    image: technurturelabs-app:latest
    container_name: LMS_event_worker
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:admin@db:5432/technurturelabs}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npx tsx scripts/event-worker.ts

  # ----------------------------
  # PostgreSQL Database
  # On first init (empty data volume), PostgreSQL automatically runs all
  # scripts in docker-entrypoint-initdb.d in lexicographic order:
  #   01_schema.sql — full schema (all tables, indexes, constraints)
  #   02_seed.sql   — seed data  (admin, classes, payment plans, settings)
  # ----------------------------
  db:
    image: postgres:15
    container_name: LMS_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-technurturelabs}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      # Two-stage check: first verify postgres is accepting connections,
      # then verify the schema init scripts have finished by checking that
      # the super_admins table exists. This prevents the app from starting
      # while docker-entrypoint-initdb.d scripts are still running.
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-technurturelabs} && psql -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-technurturelabs} -c 'SELECT 1 FROM super_admins LIMIT 1' > /dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ----------------------------
  # Redis Cache
  # ----------------------------
  redis:
    image: redis:7-alpine
    container_name: LMS_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  default:
    name: technurture_net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
