services:
  # ----------------------------
  # Caddy — Reverse Proxy + Automatic SSL (Let's Encrypt)
  # ----------------------------
  caddy:
    image: caddy:2-alpine
    container_name: LMS_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-technurturelms.in}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------
  # Next.js Application
  # ----------------------------
  app:
    image: technurturelabs-app:latest
    container_name: LMS_app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://technurturelms.in}
        - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # CRITICAL: Use container-internal DB URL (db:5432) with password from .env
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-technurturelabs}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - MEDIA_SECRET=${MEDIA_SECRET:-}
      - CRON_SECRET=${CRON_SECRET}
      - DATABASE_APP_ROLE_PASSWORD=${DATABASE_APP_ROLE_PASSWORD}
      # Cloudflare R2 — leave empty to use local fallback storage
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_ACCESS_KEY_ID=${CLOUDFLARE_ACCESS_KEY_ID:-}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY:-}
      - CLOUDFLARE_BUCKET_NAME=${CLOUDFLARE_BUCKET_NAME:-}
      - CLOUDFLARE_PUBLIC_DOMAIN=${CLOUDFLARE_PUBLIC_DOMAIN:-}
      - CLOUDFLARE_WORKER_URL=${CLOUDFLARE_WORKER_URL:-}
      # Cloudflare Stream — for video hosting
      - CLOUDFLARE_STREAM_API_TOKEN=${CLOUDFLARE_STREAM_API_TOKEN:-}
      # Razorpay
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://technurturelms.in}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy




  # ----------------------------
  # PostgreSQL Database
  # On first init (empty data volume), PostgreSQL automatically runs all
  # scripts in docker-entrypoint-initdb.d in lexicographic order:
  #   01_schema.sql — full schema (all tables, indexes, constraints)
  #   02_seed.sql   — seed data  (admin, classes, payment plans, settings)
  # ----------------------------
  db:
    image: postgres:15
    container_name: LMS_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-technurturelabs}
    # SECURITY: Do NOT expose PostgreSQL to host in production. Remove ports: line for production deployments.
    ports:
       - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Simple check: verify postgres is accepting connections.
      # Schema initialization (migrations) happens in app container via docker-entrypoint.sh
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------
  # Redis Cache
  # ----------------------------
  redis:
    image: redis:7-alpine
    container_name: LMS_redis
    restart: always
    # SECURITY: Do NOT expose Redis to host. Remove ports: line for production deployments.
    ports:
       - "6380:6379"
    # SECURITY: Set requirepass in command for authentication
    # CRITICAL: REDIS_PASSWORD MUST be set in .env before running docker-compose
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_password_docker} --activedefrag yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  default:
    name: technurture_net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
