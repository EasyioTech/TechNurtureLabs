name: Production Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.124.98.192
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd ~/TechNurtureLabs
            
            # Step 1: Force reset to match repository (clears local edits on VPS)
            git fetch --all
            git reset --hard origin/main
            
            # Step 2: Clear State & Networks
            docker compose --profile setup down --remove-orphans || true
            docker network prune -f
            docker system prune -f
            
            # Step 3: Start Services in specific order
            echo "Starting Core Services..."
            docker compose up -d db redis
            
            echo "Running database setup and migrations..."
            docker compose --profile setup up migration --abort-on-container-exit
            
            echo "Building and Starting Application..."
            docker compose up -d --build app
            
            # Step 4: Final Cleanup
            docker system prune -f
            
            echo "Deployment successful!"

      - name: Success Notification
        if: success()
        run: echo "🚀 Deployment to Production (187.124.98.192:3000) was successful!"

      - name: Failure Notification
        if: failure()
        run: echo "❌ Deployment failed. Please check the logs in GitHub Actions."
