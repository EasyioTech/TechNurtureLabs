name: Production Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.124.98.192
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd ~/TechNurtureLabs
            
            # Step 1: Force sync with repo (discard any local VPS edits)
            git fetch --all
            git reset --hard origin/main
            
            # Step 2: Clean up stale Docker state
            docker compose --profile setup down --remove-orphans || true
            docker network prune -f
            docker system prune -f
            
            # Step 3: Start DB & Redis first
            docker compose up -d db redis
            
            # Step 4: Apply canonical schema (idempotent — safe to run every deploy)
            docker compose --profile setup up migration --abort-on-container-exit
            
            # Step 5: Build and start the app
            docker compose up -d --build app
            
            # Step 6: Cleanup build artifacts to save storage
            docker system prune -f
            
            echo "✅ Deployment complete!"

      - name: Success Notification
        if: success()
        run: echo "🚀 Deployment to Production (187.124.98.192:3000) was successful!"

      - name: Failure Notification
        if: failure()
        run: echo "❌ Deployment failed. Please check the logs in GitHub Actions."
