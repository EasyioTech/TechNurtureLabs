name: Production Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.124.98.192
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd ~/TechNurtureLabs
            git pull origin main
            
            # Rebuild and restart the cluster
            docker compose down
            docker compose up -d --build
            
            # Wait for the app to be ready
            echo "Waiting for application to start..."
            sleep 15
            
            # Safe Schema Synchronization
            # Instead of dropping the DB, we run push to update the schema safely
            echo "Synchronizing database schema..."
            docker exec LMS_app npm run db:push
            
            echo "Deployment successful!"

      - name: Success Notification
        if: success()
        run: echo "🚀 Deployment to Production (187.124.98.192:3000) was successful!"

      - name: Failure Notification
        if: failure()
        run: echo "❌ Deployment failed. Please check the logs in GitHub Actions."
